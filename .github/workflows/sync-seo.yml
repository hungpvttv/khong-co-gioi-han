name: Sync SEO metadata from Pages CMS

on:
  push:
    branches: [main]
    paths:
      - "data/site.json"
      - "scripts/sync-seo.py"
      - ".github/workflows/sync-seo.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate crawler-readable metadata
        run: python3 scripts/sync-seo.py
      - name: Commit generated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/index.html' sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync SEO metadata from Pages CMS"
            git push
          else
            echo "SEO metadata is already up to date."
          fi
