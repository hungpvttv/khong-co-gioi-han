name: Sync CMS-managed SEO metadata

on:
  push:
    branches: [main]
    paths:
      - "data/site.json"
      - "scripts/sync-seo.py"
      - ".github/workflows/sync-seo.yml"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-seo-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate crawler-readable SEO metadata
        run: python3 scripts/sync-seo.py

      - name: Commit generated metadata when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "SEO metadata is already up to date."
            exit 0
          fi
          git commit -m "chore: sync SEO metadata from Pages CMS"
          git push origin HEAD:main
