name: Build and deploy site with CMS-managed SEO

on:
  push:
    branches: [main]
    paths:
      - "data/site.json"
      - "scripts/sync-seo.py"
      - ".github/workflows/sync-seo.yml"
      - "**/*.html"
      - "assets/images/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate crawler-readable SEO metadata
        run: python3 scripts/sync-seo.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
