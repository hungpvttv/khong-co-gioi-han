media:
  input: assets/images
  output: /assets/images

content:
  - name: site
    label: Nhận diện và điều hướng website
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Tên thương hiệu
        type: string
      - name: slogan
        label: Slogan
        type: string
      - name: description
        label: Mô tả website
        type: text
      - name: logo
        label: Logo
        type: image
      - name: favicon
        label: Favicon
        type: image
      - name: menu
        label: Menu điều hướng (kéo thả để sắp xếp)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Tên mục
            type: string
          - name: url
            label: Đường dẫn
            type: string
          - name: visible
            label: Hiển thị
            type: boolean
      - name: footer_title
        label: Tiêu đề chân trang
        type: string
      - name: footer_text
        label: Nội dung chân trang
        type: text

  - name: homepage
    label: Trang chủ và ảnh hero
    type: file
    path: data/homepage.json
    format: json
    fields:
      - name: hero_eyebrow
        label: Dòng dẫn đầu hero
        type: string
      - name: hero_title
        label: Tiêu đề hero
        type: string
      - name: hero_slogan
        label: Slogan hero
        type: string
      - name: hero_description
        label: Mô tả hero
        type: text
      - name: hero_button
        label: Chữ nút hero
        type: string
      - name: hero_button_url
        label: Liên kết nút hero
        type: string
      - name: hero_slides
        label: Ảnh trình chiếu (kéo thả để sắp xếp)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Ảnh {index}: {alt}"
        fields:
          - name: image
            label: Ảnh banner
            type: image
          - name: alt
            label: Mô tả ảnh
            type: string
          - name: visible
            label: Hiển thị
            type: boolean
      - name: intro_title
        label: Tiêu đề giới thiệu
        type: string
      - name: intro_text
        label: Nội dung giới thiệu
        type: text

  - name: sections
    label: Tám nội dung
    type: collection
    path: data/sections
    filename: "{primary}.yml"
    format: yaml
    fields:
      - name: number
        label: Số thứ tự
        type: number
      - name: title
        label: Tiêu đề
        type: string
      - name: slug
        label: Đường dẫn
        type: string
      - name: intro
        label: Giới thiệu
        type: text
      - name: visible
        label: Hiển thị
        type: boolean
    operations:
      delete: false

  - name: challenge
    label: Thử thách 7 ngày
    type: file
    path: data/challenge.json
    format: json
    fields:
      - name: days
        label: Các ngày thử thách
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Ngày {day}"
        fields:
          - name: day
            label: Ngày
            type: number
          - name: title
            label: Nhiệm vụ
            type: string
          - name: visible
            label: Hiển thị
            type: boolean

  - name: impact
    label: Dấu ấn thay đổi
    type: file
    path: data/impact.yml
    format: yaml
    fields:
      - name: note
        label: Ghi chú kiểm chứng
        type: text

  - name: legal_cards
    label: Thư viện pháp luật
    type: file
    path: data/legal.json
    format: json
    fields:
      - name: cards
        label: Danh sách thẻ pháp luật
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tiêu đề thẻ
            type: string
          - name: article
            label: Điều luật
            type: string
          - name: summary
            label: Diễn giải
            type: text
          - name: source_url
            label: Liên kết văn bản gốc
            type: string
          - name: visible
            label: Hiển thị
            type: boolean

  - name: quiz_questions
    label: Câu hỏi trắc nghiệm
    type: file
    path: data/quiz.json
    format: json
    fields:
      - name: questions
        label: Bộ câu hỏi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Câu hỏi
            type: text
          - name: option_a
            label: Phương án A
            type: string
          - name: option_b
            label: Phương án B
            type: string
          - name: option_c
            label: Phương án C
            type: string
          - name: correct
            label: Đáp án đúng (A/B/C)
            type: string
          - name: explanation
            label: Giải thích
            type: text
          - name: visible
            label: Hiển thị
            type: boolean

  - name: family_article
    label: Bài viết gia đình
    type: file
    path: data/family-article.json
    format: json
    fields:
      - name: title
        label: Tiêu đề
        type: string
      - name: sapo
        label: Sapo
        type: text
      - name: hero_image
        label: Ảnh đại diện bài viết
        type: image
      - name: hero_alt
        label: Mô tả ảnh đại diện
        type: string
      - name: blocks
        label: Nội dung bài viết
        type: block
        list: true
        blockKey: type
        blocks:
          - name: paragraph
            label: Đoạn văn
            fields:
              - name: text
                label: Nội dung
                type: rich-text
          - name: heading
            label: Tiêu đề phụ
            fields:
              - name: heading
                label: Tiêu đề
                type: string
          - name: image
            label: Ảnh minh họa
            fields:
              - name: image
                label: Ảnh
                type: image
              - name: alt
                label: Mô tả ảnh
                type: string
              - name: caption
                label: Chú thích
                type: string
          - name: quote
            label: Trích dẫn
            fields:
              - name: quote
                label: Nội dung trích dẫn
                type: text
          - name: story
            label: Câu chuyện minh họa
            fields:
              - name: story_title
                label: Tên câu chuyện
                type: string
              - name: story_body
                label: Nội dung câu chuyện
                type: rich-text
              - name: story_message
                label: Thông điệp
                type: text
              - name: story_question
                label: Câu hỏi gợi mở
                type: text
      - name: illustrative_note
        label: Ghi chú câu chuyện minh họa
        type: text
      - name: visible
        label: Hiển thị
        type: boolean

  - name: school_gallery
    label: Thư viện ảnh trường học
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: gallery
        label: Danh sách ảnh
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Ảnh
            type: image
          - name: caption
            label: Chú thích
            type: string
          - name: alt
            label: Mô tả ảnh
            type: string
          - name: order
            label: Thứ tự
            type: number
          - name: visible
            label: Hiển thị
            type: boolean

settings:
  content:
    merge: true
  commit:
    identity: user
