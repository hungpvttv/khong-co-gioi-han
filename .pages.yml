media:
  input: assets/images
  output: /assets/images

content:
  - name: site
    label: Cấu hình website
    type: file
    path: data/site.yml
    format: yaml
    fields:
      - name: name
        label: Tên website
        type: string
      - name: slogan
        label: Slogan
        type: string
      - name: description
        label: Mô tả
        type: text

  - name: homepage
    label: Trang chủ
    type: file
    path: data/homepage.yml
    format: yaml
    fields:
      - name: intro_title
        label: Tiêu đề giới thiệu
        type: string
      - name: intro_text
        label: Nội dung giới thiệu
        type: text
      - name: hero_slides
        label: Ảnh trình chiếu
        type: image
        list: true

  - name: sections
    label: Tám nội dung
    type: collection
    path: data/sections
    filename: "{primary}.yml"
    format: yaml
    fields:
      - name: number
        label: Số thứ tự
        type: number
      - name: title
        label: Tiêu đề
        type: string
      - name: slug
        label: Đường dẫn
        type: string
      - name: intro
        label: Giới thiệu
        type: text
      - name: visible
        label: Hiển thị
        type: boolean
    operations:
      delete: false

  - name: challenge
    label: Thử thách 7 ngày
    type: file
    path: data/challenge.json
    format: json
    fields:
      - name: days
        label: Các ngày thử thách
        type: object
        list: true
        fields:
          - name: day
            label: Ngày
            type: number
          - name: title
            label: Nhiệm vụ
            type: string
          - name: visible
            label: Hiển thị
            type: boolean

  - name: impact
    label: Dấu ấn thay đổi
    type: file
    path: data/impact.yml
    format: yaml
    fields:
      - name: note
        label: Ghi chú kiểm chứng
        type: text

  - name: legal_cards
    label: Thư viện pháp luật
    type: file
    path: data/legal.json
    format: json
    fields:
      - name: cards
        label: Danh sách thẻ pháp luật
        type: object
        list: true
        fields:
          - name: title
            label: Tiêu đề thẻ
            type: string
          - name: article
            label: Điều luật
            type: string
          - name: summary
            label: Diễn giải
            type: text
          - name: source_url
            label: Liên kết văn bản gốc
            type: string
          - name: visible
            label: Hiển thị
            type: boolean

  - name: quiz_questions
    label: Câu hỏi trắc nghiệm
    type: file
    path: data/quiz.json
    format: json
    fields:
      - name: questions
        label: Bộ câu hỏi
        type: object
        list: true
        fields:
          - name: question
            label: Câu hỏi
            type: text
          - name: option_a
            label: Phương án A
            type: string
          - name: option_b
            label: Phương án B
            type: string
          - name: option_c
            label: Phương án C
            type: string
          - name: correct
            label: Đáp án đúng (A/B/C)
            type: string
          - name: explanation
            label: Giải thích
            type: text
          - name: visible
            label: Hiển thị
            type: boolean

  - name: family_article
    label: Bài viết gia đình
    type: file
    path: data/family-article.json
    format: json
    fields:
      - name: title
        label: Tiêu đề
        type: string
      - name: sapo
        label: Sapo
        type: text
      - name: paragraphs
        label: Các đoạn nội dung
        type: text
        list: true
      - name: stories
        label: Ba câu chuyện minh họa
        type: object
        list: true
        fields:
          - name: title
            label: Tên câu chuyện
            type: string
          - name: body
            label: Nội dung
            type: text
          - name: message
            label: Thông điệp
            type: string
          - name: question
            label: Câu hỏi gợi mở
            type: text
      - name: illustrative_note
        label: Ghi chú câu chuyện minh họa
        type: text
      - name: visible
        label: Hiển thị
        type: boolean

  - name: school_gallery
    label: Thư viện ảnh trường học
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: gallery
        label: Danh sách ảnh
        type: object
        list: true
        fields:
          - name: image
            label: Ảnh
            type: image
          - name: caption
            label: Chú thích
            type: string
          - name: alt
            label: Mô tả ảnh
            type: string
          - name: order
            label: Thứ tự
            type: number
          - name: visible
            label: Hiển thị
            type: boolean

settings:
  content:
    merge: true
  commit:
    identity: user
