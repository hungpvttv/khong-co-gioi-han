title: "Bình đẳng bắt đầu từ một căn bếp, một lời động viên và một ước mơ"
sapo: "Từ cách chia sẻ việc nhà đến cách cha mẹ lắng nghe ước mơ của con, bình đẳng giới hiện diện trong những lựa chọn nhỏ mỗi ngày."
body: "Nội dung bài viết được biên tập theo hồ sơ dự án."
illustrative_note: "Ba câu chuyện là tình huống minh họa, không phải nhân vật có thật."
visible: true
